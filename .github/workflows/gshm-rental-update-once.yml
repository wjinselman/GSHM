name: Apply corrected GSHM rental agreement once
on:
  push:
    branches:
      - review/gshm-caitlin-nov21
    paths:
      - .github/workflows/gshm-rental-update-once.yml

permissions:
  contents: write

jobs:
  replace-corrected-agreement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify previous rental document
        run: |
          test "$(git hash-object documents/2026-indoor-rental-agreement.docx)" = "f154dc134a9c022caa770e5a6b6c0ef05217fae1"
      - name: Apply Caitlin's corrected signed-off wording
        run: |
          python3 - <<'PY'
          import base64, os, re, tempfile, zipfile, zlib, xml.etree.ElementTree as ET
          from pathlib import Path
          
          path=Path("documents/2026-indoor-rental-agreement.docx")
          replacement=zlib.decompress(base64.b64decode(""))
          assert b"THE PARTY/RENTAL MUST END" in replacement
          assert b"IN TIME FOR THE PREMISES TO BE VACATED BY" in replacement
          old=path.read_bytes()
          with tempfile.NamedTemporaryFile(suffix=".docx",dir=path.parent,delete=False) as tmp:
              temp=tmp.name
          try:
              with zipfile.ZipFile(path) as src, zipfile.ZipFile(temp,"w") as dest:
                  for entry in src.infolist():
                      data=src.read(entry.filename)
                      if entry.filename=="word/document.xml":
                          pattern=rb"<w:p\b[^>]*>.*?</w:p>"
                          matches=list(re.finditer(pattern,data,re.S))
                          candidates=[m for m in matches if b"THE PARTY/RENTAL MUST END BY 11:00 P.M." in m.group()]
                          assert len(candidates)==1, f"Expected one old rental term; got {len(candidates)}"
                          found=candidates[0]
                          assert b"VACATED BY 12A.M." in found.group()
                          data=data[:found.start()]+replacement+data[found.end():]
                          ET.fromstring(data)
                          assert b"VACATED BY 12A.M." not in data
                      dest.writestr(entry,data)
              with zipfile.ZipFile(temp) as check:
                  assert check.testzip() is None
                  doc=check.read("word/document.xml")
                  assert b"THE PARTY/RENTAL MUST END" in doc and b"This includes all cleaning." in doc
              os.replace(temp,path)
          finally:
              if os.path.exists(temp): os.unlink(temp)
          print("Corrected rental agreement saved:",len(old),"->",path.stat().st_size)
          PY
      - name: Commit corrected form and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add documents/2026-indoor-rental-agreement.docx
          git rm .github/workflows/gshm-rental-update-once.yml
          git commit -m "Replace rental agreement with Caitlin's corrected 11pm checkout rule"
          git push origin HEAD:review/gshm-caitlin-nov21
